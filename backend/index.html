<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>色盲图谱生成器</title>
  <style>
    :root{
      --bg:#0c0c10; --card:#17171d; --line:#2a2a34; --text:#f7f7f9; --muted:#a6a7b3; --accent:#7f8cff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC","Microsoft YaHei",sans-serif;
      background: radial-gradient(circle at top, #1a1a23, var(--bg) 45%);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{max-width:1200px; margin:0 auto; padding:24px;}
    .header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:18px;}
    h1{margin:0; font-size:28px; line-height:1.15}
    .sub{color:var(--muted); margin-top:8px; font-size:14px}
    .grid{display:grid; grid-template-columns: 1fr 1fr; gap:18px;}
    .card{
      background:rgba(23,23,29,.82); border:1px solid var(--line); border-radius:20px; padding:18px; backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .section-title{font-size:16px; margin:0 0 12px;}
    .controls{display:grid; gap:12px}
    label{font-size:13px; color:var(--muted); display:block; margin-bottom:8px}
    input[type="file"], input[type="text"], input[type="number"]{
      width:100%; background:#0f0f14; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px;
    }
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    .btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
    button{
      border:none; cursor:pointer; border-radius:14px; padding:12px 16px; font-weight:600;
      background:var(--accent); color:white;
    }
    button.secondary{background:#232331; color:#f0f0f6; border:1px solid #323247}
    button.ghost{background:transparent; border:1px solid #323247; color:#d7d7e5}
    button:disabled{opacity:.45; cursor:not-allowed}
    .preview{
      display:grid; grid-template-columns:1fr 1fr; gap:12px;
    }
    .panel{
      border:1px solid var(--line); border-radius:16px; padding:12px; background:#111118;
    }
    .canvas-wrap{
      aspect-ratio:1/1; width:100%; display:flex; align-items:center; justify-content:center; overflow:hidden;
      background:#09090d; border-radius:12px;
    }
    canvas, img{max-width:100%; max-height:100%; display:block}
    .status{
      margin-top:12px; padding:12px 14px; background:#101018; border:1px solid var(--line); border-radius:12px; color:#d8d8e2; font-size:14px;
    }
    .tiny{font-size:12px; color:var(--muted); line-height:1.6}
    .footer-note{margin-top:10px; font-size:12px; color:var(--muted)}
    @media (max-width: 920px){
      .grid,.preview,.row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>色盲图谱生成器</h1>
        <div class="sub">观众上传图片 → 浏览器本地生成图谱 → 下载 / 打印 → 发送到大屏轮播</div>
      </div>
      <div class="tiny">零代码修改用法：<br/>1）整包部署到 Render，前端会自动连同域后端<br/>2）若前端单独部署到 Vercel，可在下方填写后端地址</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2 class="section-title">输入与生成参数</h2>
        <div class="controls">
          <div>
            <label>上传图片</label>
            <input id="fileInput" type="file" accept="image/*" />
          </div>

          <div class="row">
            <div>
              <label>嵌入符号 / 数字</label>
              <input id="symbolInput" type="text" value="75" maxlength="3" />
            </div>
            <div>
              <label>输出尺寸（像素）</label>
              <input id="sizeInput" type="number" min="512" max="2048" step="64" value="1024" />
            </div>
          </div>

          <div class="row">
            <div>
              <label>圆点尺寸</label>
              <input id="dotInput" type="number" min="8" max="40" value="18" />
            </div>
            <div>
              <label>图谱保留原图程度（0-1）</label>
              <input id="mixInput" type="number" min="0.1" max="1" step="0.1" value="0.55" />
            </div>
          </div>

          <div>
            <label>后端地址（可选）</label>
            <input id="backendInput" type="text" placeholder="默认自动使用当前站点域名，例如 https://your-backend.onrender.com" />
          </div>

          <div class="btns">
            <button id="generateBtn">生成图谱</button>
            <button id="sendBtn" class="secondary" disabled>发送到大屏</button>
            <button id="downloadBtn" class="ghost" disabled>下载 PNG</button>
            <button id="printBtn" class="ghost" disabled>打印</button>
          </div>

          <div id="statusBox" class="status">等待上传图片。</div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">预览</h2>
        <div class="preview">
          <div class="panel">
            <div class="tiny" style="margin-bottom:8px">原图</div>
            <div class="canvas-wrap"><img id="sourcePreview" alt="原图预览" /></div>
          </div>
          <div class="panel">
            <div class="tiny" style="margin-bottom:8px">生成结果</div>
            <div class="canvas-wrap"><canvas id="resultCanvas" width="1024" height="1024"></canvas></div>
          </div>
        </div>
        <div class="footer-note">说明：图谱生成在浏览器本地完成，只有“生成好的 PNG”会被发送到后端排队展示。</div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const sourcePreview = document.getElementById('sourcePreview');
    const resultCanvas = document.getElementById('resultCanvas');
    const ctx = resultCanvas.getContext('2d');
    const generateBtn = document.getElementById('generateBtn');
    const sendBtn = document.getElementById('sendBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const printBtn = document.getElementById('printBtn');
    const statusBox = document.getElementById('statusBox');
    const symbolInput = document.getElementById('symbolInput');
    const sizeInput = document.getElementById('sizeInput');
    const dotInput = document.getElementById('dotInput');
    const mixInput = document.getElementById('mixInput');
    const backendInput = document.getElementById('backendInput');

    let loadedImage = null;
    let resultDataUrl = null;

    function getBackendBase() {
      const urlFromInput = backendInput.value.trim();
      if (urlFromInput) {
        localStorage.setItem('ISHIHARA_BACKEND_URL', urlFromInput);
        return urlFromInput.replace(/\/$/, '');
      }
      const saved = localStorage.getItem('ISHIHARA_BACKEND_URL');
      if (saved) return saved.replace(/\/$/, '');
      return window.location.origin.replace(/\/$/, '');
    }

    backendInput.value = localStorage.getItem('ISHIHARA_BACKEND_URL') || '';

    function setStatus(msg) {
      statusBox.textContent = msg;
    }

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      sourcePreview.src = url;

      const img = new Image();
      img.onload = () => {
        loadedImage = img;
        setStatus('图片已加载，可以开始生成。');
      };
      img.src = url;
    });

    function drawIshiharaStyle(img, options) {
      const size = options.size;
      resultCanvas.width = size;
      resultCanvas.height = size;
      ctx.clearRect(0, 0, size, size);
      ctx.fillStyle = '#f5f0e6';
      ctx.fillRect(0, 0, size, size);

      const temp = document.createElement('canvas');
      temp.width = size;
      temp.height = size;
      const tctx = temp.getContext('2d');

      const scale = Math.max(size / img.width, size / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const dx = (size - drawW) / 2;
      const dy = (size - drawH) / 2;
      tctx.drawImage(img, dx, dy, drawW, drawH);

      const imageData = tctx.getImageData(0, 0, size, size).data;

      const mask = document.createElement('canvas');
      mask.width = size;
      mask.height = size;
      const mctx = mask.getContext('2d');
      mctx.clearRect(0, 0, size, size);
      mctx.fillStyle = 'black';
      const fontSize = size * 0.34;
      mctx.font = `900 ${fontSize}px Arial, sans-serif`;
      mctx.textAlign = 'center';
      mctx.textBaseline = 'middle';
      mctx.fillText(options.symbol || '75', size / 2, size / 2);
      const maskData = mctx.getImageData(0, 0, size, size).data;

      const dot = clamp(options.dot, 8, 40);
      const radiusBase = dot * 0.48;
      const mix = clamp(options.mix, 0.1, 1);

      const bgPalette = [
        [228, 149, 120], [220, 171, 119], [175, 201, 141], [136, 185, 164], [201, 151, 178]
      ];
      const fgPalette = [
        [230, 110, 125], [154, 95, 204], [242, 96, 116], [125, 76, 188]
      ];

      function pick(arr, i) { return arr[Math.abs(i) % arr.length]; }

      for (let y = dot / 2; y < size; y += dot) {
        for (let x = dot / 2; x < size; x += dot) {
          const ix = (Math.floor(y) * size + Math.floor(x)) * 4;
          const r = imageData[ix] || 200;
          const g = imageData[ix + 1] || 180;
          const b = imageData[ix + 2] || 160;
          const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
          const variance = ((r - g) ** 2 + (g - b) ** 2 + (b - r) ** 2) / 3;
          const insideSymbol = (maskData[ix + 3] || 0) > 10;

          const paletteColor = insideSymbol ? pick(fgPalette, x + y) : pick(bgPalette, x + y);
          const outR = Math.round(r * mix + paletteColor[0] * (1 - mix));
          const outG = Math.round(g * mix + paletteColor[1] * (1 - mix));
          const outB = Math.round(b * mix + paletteColor[2] * (1 - mix));

          const radius = radiusBase * (0.76 + (variance / 25500));
          ctx.beginPath();
          ctx.arc(x + ((Math.random() - 0.5) * 1.8), y + ((Math.random() - 0.5) * 1.8), radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${outR}, ${outG}, ${outB})`;
          ctx.fill();

          if (luminance > 150) {
            ctx.beginPath();
            ctx.arc(x - radius * 0.2, y - radius * 0.2, radius * 0.28, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.10)';
            ctx.fill();
          }
        }
      }

      ctx.globalAlpha = 0.12;
      ctx.drawImage(temp, 0, 0);
      ctx.globalAlpha = 1;
    }

    generateBtn.addEventListener('click', () => {
      if (!loadedImage) {
        setStatus('请先上传图片。');
        return;
      }

      setStatus('正在生成图谱...');
      const size = parseInt(sizeInput.value || '1024', 10);
      const dot = parseInt(dotInput.value || '18', 10);
      const mix = parseFloat(mixInput.value || '0.55');
      const symbol = (symbolInput.value || '75').slice(0, 3);

      window.requestAnimationFrame(() => {
        drawIshiharaStyle(loadedImage, { size, dot, mix, symbol });
        resultDataUrl = resultCanvas.toDataURL('image/png');
        sendBtn.disabled = false;
        downloadBtn.disabled = false;
        printBtn.disabled = false;
        setStatus('图谱生成完成，可以下载、打印，或发送到大屏。');
      });
    });

    sendBtn.addEventListener('click', async () => {
      if (!resultDataUrl) {
        setStatus('请先生成图谱。');
        return;
      }
      const backendBase = getBackendBase();
      setStatus('正在发送到大屏队列...');
      try {
        const res = await fetch(`${backendBase}/upload_generated`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            imageBase64: resultDataUrl,
            symbol: symbolInput.value || '75',
            sourceName: fileInput.files?.[0]?.name || ''
          })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || '上传失败');
        setStatus(`已发送到大屏，当前排队中图片数：${data.queue_length}`);
      } catch (err) {
        console.error(err);
        setStatus(`发送失败：${err.message}。如果前端和后端不是同一站点，请在“后端地址”里填入 Render 后端域名。`);
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultDataUrl) return;
      const a = document.createElement('a');
      a.href = resultDataUrl;
      a.download = `ishihara_${Date.now()}.png`;
      a.click();
    });

    printBtn.addEventListener('click', () => {
      if (!resultDataUrl) return;
      const w = window.open('', '_blank');
      w.document.write(`
        <html><head><title>打印图谱</title>
        <style>html,body{margin:0;padding:0} img{width:100vw;height:100vw;object-fit:contain;display:block;margin:0 auto}</style>
        </head><body><img src="${resultDataUrl}" onload="window.print();setTimeout(()=>window.close(),300);" /></body></html>
      `);
      w.document.close();
    });
  </script>
</body>
</html>
