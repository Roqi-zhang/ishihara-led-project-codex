<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>测试上传 generated</title>
</head>
<body>
  <h2>测试 /upload_generated</h2>
  <button id="btn">发送测试图片</button>
  <pre id="result"></pre>

  <script>
    // 一个很小的 1x1 PNG base64 测试图
    const tinyPng =
      "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WnTqS8AAAAASUVORK5CYII=";

    document.getElementById("btn").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "发送中...";

      try {
        const res = await fetch("http://127.0.0.1:5000/upload_generated", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            imageBase64: tinyPng,
            symbol: "75",
            sourceName: "test.png"
          })
        });

        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = "请求失败: " + err.message;
      }
    });
  </script>
</body>
</html>
