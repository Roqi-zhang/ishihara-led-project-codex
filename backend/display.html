<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED 展示页</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, "PingFang SC","Microsoft YaHei",sans-serif;
      color: white;
    }
    .wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    img {
      max-width: 100vw; max-height: 100vh;
      object-fit: contain;
      display: none;
    }
    .idle {
      text-align: center; color: rgba(255,255,255,.75);
      letter-spacing: .08em;
    }
    .idle .small { font-size: 16px; opacity: .65; margin-top: 10px; }
    .topbar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: rgba(255,255,255,.6);
      z-index: 20;
    }
    input {
      width: 360px; max-width: 44vw; background: rgba(255,255,255,.06); color: white;
      border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>LED 展示页 · 自动顺序轮播</div>
      <div>
        <input id="backendInput" placeholder="可选：单独填写后端地址；留空默认用当前站点域名" />
      </div>
    </div>
    <div id="idle" class="idle">
      <div style="font-size:42px; font-weight:700;">WAITING FOR NEXT IMAGE</div>
      <div class="small">等待新的色盲图谱进入展示队列</div>
    </div>
    <img id="screen" alt="当前展示图片" />
  </div>

  <script>
    const img = document.getElementById('screen');
    const idle = document.getElementById('idle');
    const backendInput = document.getElementById('backendInput');

    backendInput.value = localStorage.getItem('ISHIHARA_BACKEND_URL') || '';

    function getBackendBase() {
      const urlFromInput = backendInput.value.trim();
      if (urlFromInput) {
        localStorage.setItem('ISHIHARA_BACKEND_URL', urlFromInput);
        return urlFromInput.replace(/\/$/, '');
      }
      const saved = localStorage.getItem('ISHIHARA_BACKEND_URL');
      if (saved) return saved.replace(/\/$/, '');
      return window.location.origin.replace(/\/$/, '');
    }

    let busy = false;

    function buildImageSrc(backendBase, imageUrl) {
      if (!imageUrl) return '';

      const trimmed = String(imageUrl).trim();
      if (/^https?:\/\//i.test(trimmed)) {
        return `${trimmed}${trimmed.includes('?') ? '&' : '?'}t=${Date.now()}`;
      }

      return `${backendBase}${trimmed}?t=${Date.now()}`;
    }

    async function pollNext() {
      if (busy) return;
      const backendBase = getBackendBase();

      try {
        const res = await fetch(`${backendBase}/next_image`);
        const data = await res.json();
        const item = data.item;

        if (!item) {
          img.style.display = 'none';
          idle.style.display = 'block';
          return;
        }

        busy = true;
        img.src = buildImageSrc(backendBase, item.image_url);
        img.style.display = 'block';
        idle.style.display = 'none';

        const seconds = data.display_seconds || 5;
        setTimeout(async () => {
          try {
            await fetch(`${backendBase}/mark_shown`, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ id: item.id })
            });
          } catch (e) {
            console.error(e);
          } finally {
            busy = false;
          }
        }, seconds * 1000);

      } catch (err) {
        console.error(err);
        idle.style.display = 'block';
        img.style.display = 'none';
      }
    }

    setInterval(pollNext, 1000);
    pollNext();
  </script>
</body>
</html>
